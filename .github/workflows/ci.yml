name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra documents
      - run: uv run pytest
      - run: uv run ruff check src tests
      - run: uv run pylint --disable=all --enable=duplicate-code src/autotune
      - run: uv run lint-imports

  contract:
    runs-on: ubuntu-latest
    env:
      AUTOTUNE_REQUIRE_TRL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra training
      - run: uv run pytest -m contract tests/contract

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --extra dev
      - run: npm ci
        working-directory: frontend
      - run: uv run python scripts/export_openapi.py > frontend/openapi.json
      - run: npm run gen:types
        working-directory: frontend
      - run: git diff --exit-code frontend/lib/api-schema.ts frontend/openapi.json
