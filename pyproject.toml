[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autotune"
version = "0.1.0"
description = "LLM Post Training & Benchmarking Engine — Plug in your data, get a frontier model out"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
documents = [
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
]
dev = [
    "httpx>=0.27",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6",
    "pylint>=3.2",
    "import-linter>=2.0",
]
training = [
    "torch>=2.2.0",
    "transformers>=4.49.0",
    "peft>=0.12.0",
    "trl>=0.18.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
    "accelerate>=0.33.0",
]

[project.scripts]
autotune = "autotune.presentation.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
markers = ["contract: checks the installed training libraries (needs --extra training)"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/autotune"]

[tool.ruff.lint]
select = ["F", "E9", "B", "BLE", "C90", "PLR0912", "PLR0913", "PLR0915", "SIM", "S110", "ERA"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares every CLI argument as a call in the parameter default.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-imports = true
ignore-docstrings = true

[tool.ruff.lint.per-file-ignores]
# Ratchet: remove an entry when its file is fixed. Never add one.
# _model builds one catalog row from seven positional facts, one per ModelSpec column.
"src/autotune/core/domain/model_catalog.py" = ["PLR0913"]
# select_recipe takes the VRAM budget plus one keyword per choice the planner forces.
"src/autotune/core/services/recipe_selector.py" = ["PLR0913"]
# Typer maps each CLI option to one function parameter, so benchmark commands take many.
"src/autotune/presentation/cli/main.py" = ["PLR0913"]
# train() still loads, configures, and dispatches three trainers in one body. Splitting it is its own refactor.
"src/autotune/infrastructure/backends/trl_peft_backend.py" = ["C901", "PLR0912", "PLR0915"]
# terminate_pod reports any GraphQL or transport failure as False and logs it.
"src/autotune/infrastructure/cloud/runpod_provider.py" = ["BLE001"]
# HarborBenchmark.__init__ takes keyword-only runner settings that tests replace.
"src/autotune/infrastructure/evaluators/harbor_benchmark.py" = ["PLR0913"]
# stop() and the health check must never raise while a vLLM process starts or dies.
"src/autotune/infrastructure/serving/vllm_provider.py" = ["BLE001"]

[tool.importlinter]
root_package = "autotune"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: presentation > infrastructure > core"
type = "layers"
layers = [
    "autotune.presentation",
    "autotune.infrastructure",
    "autotune.core",
]

[[tool.importlinter.contracts]]
name = "Core stays free of framework dependencies"
type = "forbidden"
source_modules = ["autotune.core"]
forbidden_modules = ["torch", "transformers", "trl", "peft", "pandas", "fastapi", "typer"]
allow_indirect_imports = true
